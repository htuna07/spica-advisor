name: Spica Advisor
description: Find security issues in Spica resources with Claude Code and report them in the job summary and a single GitHub issue.
branding:
  icon: shield
  color: blue

inputs:
  claude-code-oauth-token:
    description: Claude Code token from `claude setup-token`, so runs use the Claude subscription.
    required: true
  model:
    description: Claude model to run. Uses claude-sonnet-5-5 when empty.
    default: ""
  effort:
    description: Claude Code effort level (low, medium, high, xhigh, max). Uses Claude Code's default when empty.
    default: ""
  project-dir:
    description: Directory holding the Spica resources, relative to the repository root.
    default: .
  output-dir:
    description: Directory for the JSON and Markdown reports.
    default: output
  investigations:
    description: Comma-separated investigations to run. Runs all of them when empty.
    default: ""
  issue:
    description: Keep the report in a single issue labeled spica-advisor.
    default: "true"
  github-token:
    description: Token used to manage the report issue. Needs the issues write permission.
    default: ${{ github.token }}

runs:
  using: docker
  image: Dockerfile
  args:
    - --project-dir
    - ${{ inputs.project-dir }}
    - --output-dir
    - ${{ inputs.output-dir }}
    - --investigations
    - ${{ inputs.investigations }}
    - --github-summary
    - ${{ inputs.issue == 'true' && '--github-issue' || '--no-github-issue' }}
  env:
    CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
    SPICA_ADVISOR_MODEL: ${{ inputs.model }}
    SPICA_ADVISOR_EFFORT: ${{ inputs.effort }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
