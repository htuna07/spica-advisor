sources:
  - https://developers.openai.com/api/docs/pricing
  - https://platform.claude.com/docs/en/about-claude/pricing
# Standard tier, short context; cache_write is the 5-minute cache write price for Claude.
usd_per_million_tokens:
  gpt-6-luna:
    input: 0.10
    cached_input: 0.01
    cache_write: 0.125
    output: 0.50
  gpt-6.1-sol:
    input: 2.00
    cached_input: 0.10
    cache_write: 2.50
    output: 10.00
  claude-haiku-4-5:
    input: 1.00
    cached_input: 0.10
    cache_write: 1.25
    output: 5.00
  claude-sonnet-5-5:
    input: 2.00
    cached_input: 0.20
    cache_write: 2.50
    output: 10.00
